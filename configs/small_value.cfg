# TradebotRBX config. Lines starting with # are notes; the bot ignores them.
# "None" turns a setting off, but only where the note says so.
# If a setting must be a whole number, None or a decimal stops the bot from starting.
#
# Sections (search for the name with its brackets to jump to it):
#   [Profit]            what a trade must win to be sent
#   [Trade Rules]       items per side, Robux, how uneven, trade size
#   [Picking Trades]    search time limits, which passing trade is sent
#   [Items]             never give / never receive, duplicates, demand, sales
#   [Finding Traders]   whose inventories get searched
#   [Projected]         items with pushed-up prices
#   [Inbounds]          trades people send you: accept, counter, decline
#   [Outbounds]         trades you sent: when to cancel them
#   [Trade Ads]  [Discord]  [Debug]  [Info]


[Profit]
# Profit = what you get minus what you give. A trade is only sent if it
# passes EVERY setting here. The bot measures trades 4 ways:
#   Overall    the Rolimons value, or the RAP if the item has no value
#   Value      the Rolimons value only (RAP items count as 0)
#   RAP        Roblox's recent average price
#   Algorithm  the bot's own RAP algorithm: it works out an item's real,
#              stable price from its sales history and ignores spikes, so
#              projected (pushed-up) items don't look like profit
#
# Example:              You give   You get
#   Valued items          4000       3500
#   RAP items             2903       4015
#   Value                 4000       3500    -> Value profit    -500
#   Overall               6903       7515    -> Overall profit  +612
# It loses Value but wins Overall. To allow trades like this, Min Value
# Profit must be -500 or lower (or None).
#
# Min = the least you'll accept. Max = stops offers so greedy they get
# declined. Between -1 and 1 = a % of your side: 0.02 means 2%. None = no limit.

Min Overall Profit = 500
Max Overall Profit = 3000

# Above 0 means only trades that get you valued items can pass.
Min Value Profit = 500
Max Value Profit = None
# True = a trade with no valued items on either side (only RAP items) skips
# the Value profit check, so it can pass on the others.
# False = its Value profit is 0, so Min Value Profit above 0 blocks it.
Skip Value Profit If No Valued Items = False

Min RAP Profit = None
Max RAP Profit = None

Min Algorithm Profit = 0
Max Algorithm Profit = None
# Which Algorithm number valued items get:
#   rap_algo       the bot's sales estimate, like RAP items
#   rolimon_value  their Rolimons value
#   zero_value     0, so valued items don't affect Algorithm profit
Algorithm For Valued Items = rolimon_value


[Trade Rules]
# How many items each side can have. Whole numbers. More items = many more
# trades to check, so searching is slower. 1-for-1 trades are never sent.
# Counters use these too.
Min Items Yours = 1
Max Items Yours = 4
Min Items Theirs = 1
Max Items Theirs = 4

# Add Robux to your side when you'd get more RAP than you give:
# (their RAP - your RAP) / 4, at most half your side's RAP, at most Max Robux.
# The Robux counts toward every profit except Value, so the trade still has
# to pass after paying it.
Add Robux = true
Max Robux = 1000

# Score = how uneven a trade is: (what you get - what you give) / (both
# sides added) x 100. 0 = even, 10 = you get a bit more, negative = you get
# less. None = no limit.
Min Overall Score = 0
Max Overall Score = 35
Min RAP Score = 0
Max RAP Score = 20

# Both sides added together must be at least this. 0 = no limit.
# A Value sum above 0 means the trade must include valued items.
Min Trade Value = 4000
Min Trade RAP = 10000

# Allow RECEIVING faces / gears. Your own can always be traded away.
Receive Faces = False
Receive Gears = False


[Picking Trades]
# If an account hasn't sent a trade in this many seconds, move on to the next account.
Max Seconds Per Account = 1800

# Time limit for finding a trade with one trader. When it runs out, the bot
# picks from the trades found so far (or moves on if it found none).
Max Seconds Per Trader = 600

# Stop searching once more than this many trades pass, then pick one.
# Lower = faster. None = keep searching until the time limit.
Stop After Passing Trades = None

# Which of the trades that passed gets sent:
#   lowest_ or highest_ with rap_gain, value_gain, overall_gain, algo_gain
#   closest_score_based_on_overall_value / closest_score_based_on_rap   most even
#   lowest_ or highest_ with sum_of_trade_value, sum_of_trade_rap,
#                        sum_of_overall_value   smallest / biggest trade
#   lowest_ or highest_ with demand          Rolimons demand of all items added up
#   lowest_ or highest_ with volume_gain     daily sales you get minus you give
#   lowest_ or highest_ with sum_of_volume   daily sales of all items added up
#   upgrade (you give more items), downgrade (you get more items), random
# Combine options with +: the first decides, the next breaks its ties, and
# so on. random in a combo = random among what's still tied.
# Example: lowest_overall_gain + highest_demand + upgrade
# Or blend them: blend: a, b, c ranks every trade on each option and adds
# the ranks up, the first counting most (4 options -> weights 4, 3, 2, 1).
# The best total wins.
# Example: blend: lowest_overall_gain, highest_demand, upgrade
Pick Trade By = closest_score_based_on_rap

# Spread your items across outbounds. When one trade is accepted, every other
# outbound with the same item stops working, and you only get ~100 trades a day.
# 0 = off. 1 = always use the items you've offered least. 0.5 = skip the
# trades whose items you've offered most (the top half).
Outbound Variety = 0.5


[Items]
# Never Give = never trade these away. Never Receive = never take these.
# Item or bundle IDs separated by commas, e.g. 1029025, 1191135761. None = empty.
Never Give = None
Never Receive = None

# Extra copies of an item you're allowed to own. Whole number.
#   0 = never trade for an item you already own, 1 = you can own up to 2.
# Outbound trades that would go over this are cancelled.
Max Duplicates Owned = 0
# Extra copies of the same item you'll take from one trader.
#   0 = at most 1 of each item from them, 1 = up to 2.
Max Duplicates From Trader = 0

# Valued items you'd get: skip ones with Rolimons demand below this.
# 0 Terrible, 1 Low, 2 Normal, 3 High, 4 Amazing.
Min Demand = 2

# RAP items you'd get, judged on their sales history (items without one are
# skipped). None = no limit.
#   Min Daily Sales         average sales per day must be at least this
#   Max Days Between Sales  average days between sales must be at most this
Min Daily Sales = 1.69
Max Days Between Sales = 1.5

# Days of sales history used for RAP Algorithm, daily sales and days between
# sales. Older sales drag the RAP Algorithm toward old prices. Whole number.
Sales History Days = 90


[Finding Traders]
# The bot picks a random item matching these, reads who recently got it, and
# tries to trade with those owners. Whole numbers. Items with no value /
# demand / trend pass those checks.
Min Item Value = 1000
Min Item RAP = 1000
Min Item Owners = 100
Min Item Demand = 1
Min Item Trend = 1

#   rap    only items without a Rolimons value
#   value  only items with a Rolimons value (finds people with valued items)
#   both   either, filtered by Scan Rares
Scan Type = both
# Only with Scan Type = both. True = only rare items, False = only non-rare.
Scan Rares = false

# Owners are read a page (100 owners) at a time: each time an item is picked,
# the bot reads its next this-many pages, carrying on where the last scan of
# that item stopped, and tries every owner on them who got it recently. Once
# every page has been read, the item is skipped.
Owner Pages Per Scan = 2
# Only owners who got the item in the last this many days (likely still trading).
Recent Owner Days = 7
# How long the bot remembers where it stopped. After this many days the item
# starts from its first page again. 0 = don't remember.
Remember Scanned Owners Days = 3

# Skip traders with fewer usable items than this, after your item filters.
Min Trader Items = 4


[Projected]
# Projected = an item whose price is being pushed up artificially. The bot
# never asks for projected items in new trades ([Outbounds] covers sent ones).

# True = also trust Rolimons' projected flag.
Use Rolimons Projected Flag = false

# False = valued items are never treated as projected: Rolimons sets their
# value, so a jump in their sales price doesn't change it. True = check them
# like RAP items.
Check Valued Items = False

# The bot checks each item's price chart itself: today's price is compared
# with its typical price (the middle daily price of the last 90 days). If
# they're too far apart, it's projected. One-day spikes don't count.
#   Max Price Rise  how far BELOW today the typical price can be (price went up)
#   Max Price Drop  how far ABOVE today the typical price can be (price came
#                   down). Only counts while RAP is still that far above
#                   today too; once RAP has come down with it, it's fine.
# Between -1 and 1 = share of today's price (0.4 = 40%), otherwise Robux.
# None = don't check that direction.
# Example: today 10,000 with 0.4 / -0.4 -> projected if the typical price is
# under 6,000 or over 14,000.
Max Price Rise = 0.4
Max Price Drop = -0.4


[Inbounds]
# Trades people send you.
Check Every Minutes = 10

# Accept trades that pass the profit below and your [Items] filters
# (maximums and score are ignored: a bigger win is still a win). Never
# accepts trades that ask for your Robux or give you projected items.
# Accepting can't be undone.
Accept Good Trades = False

# Counter trades that aren't accepted. The counter keeps as much of their
# trade as it can: it changes as few items as possible to pass.
Counter = True
# Don't counter trades that are already a win in Overall.
Skip Countering Wins = True
# Decline a trade when no counter passes. False = leave it; it's tried again
# at every check.
Decline If No Counter = True

# Profit for inbounds, used to accept and to counter (same meaning as in
# [Profit]). These replace the [Profit] ones for inbounds, account configs
# included. Delete a line to use the [Profit] one instead.
Min Overall Profit = 500
Max Overall Profit = 3000
Min Value Profit = 500
Max Value Profit = None
Min RAP Profit = None
Max RAP Profit = None
Min Algorithm Profit = 0
Max Algorithm Profit = None

# Used instead of the [Items] ones for accepting and countering.
#   Max Duplicates Owned        2 = you can own up to 3 of an item
#   Max Duplicates From Trader  2 = up to 3 of one item from them
Max Duplicates Owned = 2
Max Duplicates From Trader = 2

# Counter loops: some traders (often bots) counter every counter you send.
# The same counter is never sent twice. After this many counters to one
# trader, their trades are declined instead (a trade that passes Accept Good
# Trades is still accepted). 0 = no limit.
Max Counters Per Trader = 3
# A trader who counters back within Bot Reply Minutes of your counter, Bot
# Replies times in a row, is treated as a bot and declined. 0 = off.
Bot Reply Minutes = 20
Bot Replies = 3
# How long counters and replies are remembered.
Counter Memory Hours = 24


[Outbounds]
# Trades you sent are checked every 30 minutes, and re-priced on every
# Rolimons update (~2 minutes). A trade is cancelled when:
#   - its profit drops under your Min profit minus the offset below
#   - an item turns projected (see the last two settings)
#   - you'd own more than Max Duplicates Owned
# Maximums and score aren't checked.

# How far a sent trade's profit can drop below Min Overall Profit and Min
# RAP Profit before it's cancelled.
#   Between 0 and 1 = a share of the minimum: 0.02 = cancelled once profit
#                     is more than 2% under it (minimum 600 -> under 588)
#   Otherwise Robux:  200 = minimum 600 -> cancelled under 400
# It never goes below 0 (unless your minimum is negative), so trades that
# turn into a loss are always cancelled.
Overall And RAP Cancel Offset = 400
# Same, for Min Algorithm Profit.
Algorithm Cancel Offset = 1000

# True = editing this config doesn't cancel trades you already sent: they're
# only cancelled if they turn into a loss or get a projected item.
# False = trades you already sent must pass your new settings too.
Keep Trades On Config Change = True

# True = cancel when an item you'd GET turns projected (its price may crash).
# False = keep judging it on the Algorithm price, which ignores the spike.
Cancel If Receiving Projected = True
# True = cancel when an item you're GIVING turns projected, so you don't
# trade it away while it's worth more.
Cancel If Sending Projected = False


[Trade Ads]
# Posts a Rolimons trade ad for each account. More ads = more inbounds.
Enabled = False
# Logs each account into Rolimons on its own with its Roblox cookie (the same
# as "Login with Roblox" on rolimons.com), and again if Rolimons logs it out.
Auto Rolimons Login = True
# Minutes between ads per account. Rolimons allows one every 15 minutes.
Post Every Minutes = 20

# What you offer:
#   highest_value / lowest_value  your most / least valuable items
#   random                        different items each time
#   outbound                      one of your open outbounds: your items for
#                                 theirs, taking turns (highest_value if none)
#   manual                        the items in Offer Item IDs
Offer Items Using = highest_value
# How many items highest_value / lowest_value / random list (1-4).
Offer Items = 4
# For manual: item IDs separated by commas (1-4). Items you don't own are left out.
Offer Item IDs = None

# What you ask for: Request Item IDs + Request Tags, at most 4 together.
# Tags: any, demand, rares, robux, upgrade, downgrade, wishlist, projecteds, adds.
# With outbound, the ad asks for their items instead, and tags fill the rest.
Request Item IDs = None
Request Tags = any, upgrade, downgrade


[Discord]
# Webhook URLs. Empty = off.
#   Send Webhook       a trade was sent (blue), an inbound countered (yellow),
#                      or declined because no counter passed (red)
#   Completed Webhook  a trade completed, or an inbound was accepted (green)
#   Error Webhook      the bot hit an error or an account stopped working
Send Webhook =
Completed Webhook =
Error Webhook =
# True = your accounts' usernames stay out of Discord: the footer shows only
# the other trader's ID, and errors say "account 1", "account 2".
Hide Username = True


[Debug]
# Test mode: finds trades but doesn't send, accept or counter anything. Also
# set Dont Check Outbounds = True, or your real outbounds get checked (and
# cancelled) against the test config.
Dont Send Trades = False
Dont Check Outbounds = False
# Keep going when Roblox says the account hit its daily trade limit.
Ignore Trade Limit = False
# Print extra info while running.
Show Trade Debug = False
Show Scanning Users = False
Show Scanning Inventory = False


[Info]
# Shown in the Config Manager when picking a preset.
Description = Inventories worth about 10-30k, with valued and RAP items.
