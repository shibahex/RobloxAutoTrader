# Lines starting with # are notes. The bot ignores them.
# "None" turns a setting off, but only where the note says so.
# If a setting must be a whole number, None or a decimal stops the bot from starting.

[Trading Settings]
# The bot compares trades with 4 numbers:
#   RAP            Roblox's recent average price.
#   Value          The Rolimons value. Items without a Rolimons value count as 0.
#   Overall Value  The Rolimons value if the item has one, otherwise its RAP.
#   RAP Algorithm  The bot's estimate of what an item really sells for, from its
#                  sales history. Ignores price spikes, so it's harder to fool.
#
# Gain = what you receive minus what you give.
# A trade is only sent if it passes EVERY gain setting below.
#
# Value and Overall Value are different:
#   Value          only counts valued items. RAP items count as 0.
#   Overall Value  counts every item: its value, or its RAP if it has none.
#
# Example (a real trade):
#                     You give   You get
#   Valued items        4000       3500
#   RAP items           2903       4015
#   Value total         4000       3500    -> Value gain    -500
#   Overall total       6903       7515    -> Overall gain  +612
#
# It lost Value but won Overall, so it's still a good trade.
# To allow trades like this, Minimum Value Gain must be -500 or lower (or None).
#
# A gain between -1 and 1 is a percentage of your side: 0.1 means 10%.
# Minimum = the least you'll accept. Maximum = stops offers so greedy they
# get declined. None = no limit.

Minimum RAP Gain = 300
Maximum RAP Gain = None

Minimum Overall Value Gain = 0
Maximum Overall Value Gain = 1500

# Above 0 means only trades with valued items can pass (RAP items have no Value).
Minimum Value Gain = 0
Maximum Value Gain = None

# Which RAP Algorithm number to use for items that have a Rolimons value:
#   rap_algo       the bot's sales estimate, same as RAP items
#   rolimon_value  their Rolimons value
#   zero_value     0, so valued items don't affect algorithm gain
RAP Algorithm for Valued Items = rap_algo
Minimum Rap Algorithm Gain = 450
Maximum Rap Algorithm Gain = None

# Adds Robux to your side when you'd receive more RAP than you give.
# Amount = (their RAP - your RAP) / 4, at most half your side's RAP, at most Max Robux.
# The Robux counts as part of your side in the RAP, Overall Value and RAP Algorithm
# gains and score % (not Value), so a trade still has to pass after paying it.
Trade Robux = true
Max Robux = 1000

# Score = how uneven a trade is, as a percent of the whole trade:
#   (what you get - what you give) / (both sides added) x 100
#   0 = even, 10 = you get a bit more, negative = you get less.
# Min/Max limit how uneven a trade can be. None = no limit.
Min Overall Value Score Percentage = 0
Max Overall Value Score Percentage = 30

Min RAP Score Percentage = 0
Max RAP Score Percentage = 20

# How many items each side of a trade can have. Whole numbers only.
# More items = many more trades to check, so searching is slower.
# 1-for-1 trades are never sent.
Minimum Items on Your Side = 1
Maximum Items on Your Side = 4

Minimum Items on Their Side = 1
Maximum Items on Their Side = 4

# Both sides added together must be at least this. 0 = no limit.
# A Value sum above 0 means the trade must include valued items.
Minimum Value Sum Of Trade = 0
Minimum Rap Sum Of Trade = 0

# Allow RECEIVING faces / gears. Your own faces and gears can always be traded.
Trade For Faces = False
Trade For Gears = False

[Filtering Generated Trades]
# If an account hasn't sent a trade in this many seconds, move on to your next account.
Max Seconds Spent on One User = 1800

# Time limit for finding a trade with one person. When it runs out, the bot
# picks from the trades it found so far (or moves on if it found none).
Max Seconds Spent on Generating Trades = 120

# Stop searching once it has more than this many trades that pass, then pick one.
# Lower = faster. None = keep searching until the time limit.
Max Valid Trades = None

# Which of the trades that passed gets sent. "Gain" = what you get minus what you give.
#   lowest_rap_gain / highest_rap_gain
#   lowest_value_gain / highest_value_gain
#   lowest_overall_gain / highest_overall_gain
#   lowest_algo_gain / highest_algo_gain
#   closest_score_based_on_overall_value   most even trade by Overall Value
#   closest_score_based_on_rap             most even trade by RAP
#   lowest_sum_of_trade_value / highest_sum_of_trade_value       smallest / biggest trade by Value
#   lowest_sum_of_trade_rap / highest_sum_of_trade_rap           by RAP
#   lowest_sum_of_overall_value / highest_sum_of_overall_value   by Overall Value
#   lowest_demand / highest_demand           Rolimons demand of all items added up
#   lowest_volume_gain / highest_volume_gain       daily sales you get minus daily sales you give
#   lowest_sum_of_volume / highest_sum_of_volume   daily sales of all items added up
#   upgrade      you give more items than you get
#   downgrade    you get more items than you give
#   random
Select Trade Using = closest_score_based_on_overall_value

# Spread your items across outbounds. When one trade is accepted, every other
# outbound offering the same item stops working, and you only get ~100 trades a day.
# 0 = off. 1 = always use the items you've offered the least.
# 0.5 = skip the trades whose items you've offered the most (the top half).
# Picks from what's left with "Select Trade Using".
Outbound Variety = 0.5

[Filtering Items]
# NFT = never trade these away. NFR = never receive these.
# Item IDs separated by commas, e.g. 1029025, 1191135761. None = empty list.
# Bundles need "2:" in front, e.g. 2:939596.
NFT = None
NFR = None

# How many extra copies of an item you're allowed to own. Whole number.
#   0 = never trade for an item you already own
#   1 = you can own up to 2 of the same item
# Outbound trades that would go over this are cancelled.
Maximum Amount of Duplicate Items = 0

# How many extra copies of the same item you'll take from one person. Whole number.
#   0 = at most 1 of each item from them, 1 = up to 2, and so on.
Maximum Amount of Trader Duplicate Items = 0

# Only for valued items you'd receive: skip items with Rolimons demand below this.
# Whole number: 0 Terrible, 1 Low, 2 Normal, 3 High, 4 Amazing.
Minimum Valued Item Demand = 2

# Only for RAP items you'd receive (items with no Rolimons value), from their
# sales history. Items the bot hasn't got sales history for are skipped.
#   Minimum Daily Sales     average sales per day must be at least this
#   Maximum Average Gaps    average days between sales must be at most this
# None = no limit.
Minimum Daily Sales of Item = 1.69
Maximum Average Gaps in Sales = 1.5

[Inbound Settings]
# Trades people send you are checked every "Check Inbounds Every Minutes".

# Accept trades that pass this config: your minimum gains and item filters
# (maximums and score % are ignored, a bigger win is still a win).
# Never accepts trades that ask for your Robux or give you projected items.
# Accepting can't be undone, so this is off unless you turn it on.
Accept Valid Trades = False

# Counter trades that aren't accepted, with a trade made from this config.
Counter Trades = True

# Don't counter trades that are already a win in Overall Value.
Dont Counter Wins = True

# Minutes between inbound checks.
Check Inbounds Every Minutes = 10

[Outbound Settings]
# Trades you sent are checked every 30 minutes, and re-priced every ~2 minutes
# when Rolimons updates. A trade is cancelled when:
#   - it no longer passes your minimum gains, minus the offsets below
#   - you'd receive a projected item
#   - you'd own more duplicates than "Maximum Amount of Duplicate Items"
# Maximums and score % are not checked.

# Taken off Minimum RAP Gain and Minimum Overall Value Gain. Whole number.
# Example: minimum 600, offset 200 -> cancelled once the gain drops under 400.
# It never goes below 0 (unless your minimum is negative), so trades that
# turn into a loss are always cancelled.
Outbound Minimum Gain Offset to Cancel = 400

# Same, for Minimum Rap Algorithm Gain. Whole number.
RAP Algorithm Gain Offset to Cancel = 1000

# True = when you change this config, trades you sent before the change are only
# cancelled if they become a loss (or give you a projected item), not for failing
# the new settings. Stops a config change from cancelling all your outbounds.
Only Cancel Losing Trades After Config Change = True

[Getting Owners of Items]
# How the bot finds people to trade with: it picks a random item that passes
# these filters and checks who recently got it.
# Whole numbers only. Items without a value / demand / trend pass those checks.
Minimum Value of Item = 1000
Minimum Rap of Item = 1000
Minimum Owners of Item = 100
Minimum Demand of Item = 1
Minimum Trend of Item = 1

#   rap    only items without a Rolimons value
#   value  only items with a Rolimons value
#   both   either, filtered by Scan Rares
Scan Type = both

# Only used when Scan Type = both. True = only rare items, False = only non-rare items.
Scan Rares = false

[Filtering Users]
# Skip people with fewer tradeable items than this, after your item filters. Whole number.
Minimum Total Items = 4

[Projected Detection]
# Projected = an item whose price is being pushed up artificially. The bot never
# receives projected items.

# True = treat items Rolimons marks as projected as projected.
Detect Rolimons Projecteds = false

# The bot also checks each item's price chart itself: it compares every day of the
# last 90 days with today's price. If any day is too far off, the item is projected.
#   Maximum Graph Difference  how far BELOW today a past day can be (price went up since)
#   Minimum Graph Difference  how far ABOVE today a past day can be (price came down since)
# Between -1 and 1 = share of today's price: 0.4 = 40%. Whole numbers = Robux.
# None = don't check that direction.
# Example: today 10,000 with 0.4 / -0.4 -> projected if any day was under 6,000 or over 14,000.
Maximum Graph Difference = 0.4
Minimum Graph Difference = -0.4

[debug]
# Test mode: finds trades but doesn't send, accept or counter anything.
# When testing a config, also set Dont Check Outbounds = True, or your real
# outbound trades get checked (and cancelled) against the test config.
Dont Send Trades = False
Dont Check Outbounds = False

# Keep going when Roblox says the account hit its daily trade limit.
Ignore trade limit = False

# Print extra info while running.
Show Trade Debug = False
Show Scanning Users = False
Show Scanning Inventory = False

[Discord]
# Discord webhook URLs. Leave empty to turn one off.
#   Send Webhook       a trade was sent
#   Completed Webhook  a trade completed
#   Error Webhook      the bot hit an error or an account stopped working
Send Webhook = 
Completed Webhook = 
Error Webhook = 

[Trade Ads]
# Posts a Rolimons trade ad for each account that has a Rolimons cookie
# (add one in Account Manager > Rolimons Cookies). More ads = more inbounds.
Enabled = False

# Minutes between ads for each account. Rolimons allows one every 15 minutes.
Post Every Minutes = 20

# Which of your items to list:
#   highest_value  your most valuable items
#   lowest_value   your least valuable items
#   random         different items each time
#   outbound       one of your open outbound trades: your items for theirs.
#                  Takes turns through your outbounds. Uses highest_value
#                  when there are none yet.
#   manual         the items in Offer Item IDs
Offer Items Using = highest_value
# How many items highest_value / lowest_value / random list (1-4).
Offer Items = 4
# For manual: item IDs separated by commas (1-4). Items you don't own are left out.
Offer Item IDs = None

# What you're asking for. Request Item IDs + Request Tags can be at most 4 together.
# Request Item IDs: item IDs separated by commas, or None.
# Request Tags: any, demand, rares, robux, upgrade, downgrade, wishlist, projecteds, adds
# With outbound, the ad asks for the other person's items instead of Request Item IDs,
# and tags only fill the room left.
Request Item IDs = None
Request Tags = any, upgrade, downgrade

[Info]
# Shown in the Config Manager when picking a preset.
Description = RAP items only.
